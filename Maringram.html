<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maringram</title>

<style>
:root {
  --bg: #fff8f0;
  --panel: #ffffff;
  --text: #292323;
  --muted: #8d8585;
  --accent: #ff9f9f;
  --accent2: #ffd36e;
  --border: #f0e5df;
  --message: #ffe5e5;
  --other: #ffffff;
}

body.dark {
  --bg: #171313;
  --panel: #241c1c;
  --text: #fff1f1;
  --muted: #b7a3a3;
  --accent: #e94d58;
  --accent2: #ff8585;
  --border: #392929;
  --message: #54272d;
  --other: #302525;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: .2s;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
}

.screen {
  display: none;
  min-height: 100vh;
}

.screen.active {
  display: block;
}

#auth {
  padding: 35px 22px;
  display: none;
  align-items: center;
  justify-content: center;
}

#auth.active {
  display: flex;
}

.auth-box {
  width: 100%;
  max-width: 390px;
  background: var(--panel);
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 8px 35px #0000000c;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 8px;
}

.logo span {
  color: var(--accent);
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 25px;
}

.field {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  margin-bottom: 12px;
  outline: none;
}

.primary {
  background: linear-gradient(110deg, var(--accent), var(--accent2));
  color: #382323;
  font-weight: bold;
  padding: 14px;
  width: 100%;
  border-radius: 13px;
}

.switch {
  text-align: center;
  color: var(--muted);
  margin-top: 18px;
  font-size: 14px;
}

.switch span {
  color: var(--accent);
  cursor: pointer;
  font-weight: bold;
}

.theme-switch {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.theme-switch button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}

/* Главный экран */

#main {
  height: 100vh;
  min-height: 450px;
  overflow: hidden;
}

.topbar {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 17px;
  gap: 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.brand {
  font-size: 23px;
  font-weight: bold;
  flex: 1;
}

.brand span {
  color: var(--accent);
}

.icon-button {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: var(--bg);
  color: var(--text);
  font-size: 21px;
}

.content {
  height: calc(100vh - 65px);
  overflow-y: auto;
  padding: 16px;
}

.search {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  margin-bottom: 17px;
  outline: none;
}

.section-title {
  font-size: 14px;
  color: var(--muted);
  margin: 12px 4px;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 10px;
  background: var(--panel);
  border-radius: 16px;
  margin-bottom: 9px;
  cursor: pointer;
}

.avatar {
  width: 49px;
  height: 49px;
  border-radius: 50%;
  object-fit: cover;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
  flex-shrink: 0;
}

.chat-info {
  flex: 1;
  min-width: 0;
}

.chat-name {
  font-weight: bold;
  margin-bottom: 5px;
}

.chat-last {
  color: var(--muted);
  font-size: 13px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Боковое меню */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0008;
  z-index: 10;
}

.overlay.active {
  display: block;
}

.drawer {
  position: fixed;
  z-index: 11;
  top: 0;
  left: -310px;
  width: 285px;
  height: 100%;
  background: var(--panel);
  padding: 20px;
  transition: .25s;
  box-shadow: 5px 0 25px #0002;
}

.drawer.active {
  left: 0;
}

.drawer-head {
  padding: 18px 5px 22px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 15px;
}

.drawer-user {
  font-size: 19px;
  font-weight: bold;
  margin-top: 12px;
}

.drawer-username {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.menu-button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 10px;
  background: transparent;
  color: var(--text);
  border-radius: 14px;
  text-align: left;
  margin: 5px 0;
}

.menu-button:active {
  background: var(--bg);
}

.menu-icon {
  width: 39px;
  height: 39px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.menu-icon svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-profile {
  background: #ffe5ee;
  color: #e56c98;
}

.icon-settings {
  background: #fff0cf;
  color: #c18b26;
}

.icon-exit {
  background: #ffe2df;
  color: #df6961;
}

.icon-search {
  background: #e3efff;
  color: #6191d7;
}

/* Настройки и профиль */

.page {
  display: none;
  padding: 18px;
}

.page.active {
  display: block;
}

.back {
  background: var(--panel);
  color: var(--text);
  padding: 11px 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.card {
  background: var(--panel);
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 13px;
}

.card-title {
  font-weight: bold;
  margin-bottom: 13px;
}

.option {
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.option:last-child {
  border: none;
}

.avatar-large {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 35px;
  margin: 0 auto 15px;
}

/* Чат */

#chatPage {
  display: none;
  height: 100vh;
  flex-direction: column;
}

#chatPage.active {
  display: flex;
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 82%;
  padding: 11px 13px;
  border-radius: 15px;
  background: var(--other);
  align-self: flex-start;
  overflow-wrap: anywhere;
}

.message.mine {
  background: var(--message);
  align-self: flex-end;
}

.message-meta {
  text-align: right;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}

.message-status {
  margin-left: 4px;
  font-size: 12px;
}

.chat-input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: var(--panel);
}

.chat-input-area input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  outline: none;
}

.send {
  width: 48px;
  border-radius: 14px;
  background: var(--accent);
  color: white;
  font-size: 20px;
}

.small {
  font-size: 13px;
  color: var(--muted);
}

h2 {
  font-size: 22px;
}
</style>
</head>

<body>

<!-- Вход и регистрация -->

<section id="auth" class="screen active">
  <div class="auth-box">
    <div class="logo">M<span>ari</span>ngram</div>
    <div class="subtitle">Твой мир общения</div>

    <div class="theme-switch">
      <button onclick="setTheme('light')">Розовая</button>
      <button onclick="setTheme('dark')">Тёмная</button>
    </div>

    <div id="loginForm">
      <h3>Вход</h3>
      <input id="loginUsername" class="field" placeholder="Username">
      <input id="loginPassword" class="field" type="password" placeholder="Пароль">
      <button class="primary" onclick="login()">Войти</button>
      <div class="switch">
        Нет аккаунта? <span onclick="showRegister()">Регистрация</span>
      </div>
    </div>

    <div id="registerForm" style="display:none">
      <h3>Создание аккаунта</h3>
      <input id="regName" class="field" placeholder="Твоё имя">
      <input id="regUsername" class="field" placeholder="Уникальный username">
      <input id="regPassword" class="field" type="password" placeholder="Пароль">
      <button class="primary" onclick="register()">Продолжить</button>
      <div class="switch">
        Уже есть аккаунт? <span onclick="showLogin()">Войти</span>
      </div>
    </div>
  </div>
</section>

<!-- Главная -->

<section id="main" class="screen">
  <div class="topbar">
    <button class="icon-button" onclick="openMenu()">☰</button>
    <div class="brand">M<span>ari</span>ngram</div>
    <button class="icon-button" onclick="showPage('searchPage')">⌕</button>
  </div>

  <div class="content" id="homeContent">
    <input class="search" placeholder="Поиск по чатам..." oninput="filterChats(this.value)">
    <div class="section-title">ТВОИ ЧАТЫ</div>
    <div id="chatList"></div>
  </div>

  <!-- Профиль -->
  <div class="page" id="profilePage">
    <button class="back" onclick="showHome()">← Назад</button>
    <h2>Мой профиль</h2>

    <div class="card">
      <div id="profileAvatar" class="avatar-large">M</div>
      <div style="text-align:center">
        <label class="small">Изменить фотографию</label><br><br>
        <input type="file" accept="image/*" onchange="changeAvatar(event)">
      </div>
    </div>

    <div class="card">
      <div class="card-title">Информация</div>
      <input id="editName" class="field" placeholder="Имя">
      <input id="editUsername" class="field" placeholder="Username">
      <textarea id="editBio" class="field" rows="3" placeholder="Описание профиля"></textarea>
      <button class="primary" onclick="saveProfile()">Сохранить изменения</button>
    </div>
  </div>

  <!-- Настройки -->
  <div class="page" id="settingsPage">
    <button class="back" onclick="showHome()">← Назад</button>
    <h2>Настройки</h2>

    <div class="card">
      <div class="card-title">Внешний вид</div>
      <div class="option">
        <button class="menu-button" onclick="setTheme('light')">
          <span class="menu-icon icon-profile">☀</span>
          Розово-жёлтая тема
        </button>
      </div>
      <div class="option">
        <button class="menu-button" onclick="setTheme('dark')">
          <span class="menu-icon icon-exit">☾</span>
          Чёрно-красная тема
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">О приложении</div>
      <div class="small">Maringram — версия 1.0</div>
    </div>
  </div>

  <!-- Поиск -->
  <div class="page" id="searchPage">
    <button class="back" onclick="showHome()">← Назад</button>
    <h2>Поиск пользователей</h2>
    <input id="userSearch" class="search" placeholder="Введи username..." oninput="searchUsers()">
    <div id="searchResults"></div>
  </div>
</section>

<!-- Меню -->

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="avatar" id="drawerAvatar">M</div>
    <div class="drawer-user" id="drawerName">Пользователь</div>
    <div class="drawer-username" id="drawerUsername">@username</div>
  </div>

  <button class="menu-button" onclick="openProfile()">
    <span class="menu-icon icon-profile">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 3-7 8-7s8 3 8 7"/>
      </svg>
    </span>
    Профиль
  </button>

  <button class="menu-button" onclick="openSettings()">
    <span class="menu-icon icon-settings">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19 13.5l2 1.5-2 3-2.5-1-2 1-.5 3h-4l-.5-3-2-1-2.5 1-2-3 2-1.5v-3L3 9l2-3 2.5 1 2-1 .5-3h4l.5 3 2 1 2.5-1 2 3-2 1.5z" transform="translate(0 1) scale(.9)"/>
      </svg>
    </span>
    Настройки
  </button>

  <button class="menu-button" onclick="showPage('searchPage');closeMenu()">
    <span class="menu-icon icon-search">
      <svg viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5"/>
        <path d="m16 16 5 5"/>
      </svg>
    </span>
    Найти пользователя
  </button>

  <button class="menu-button" onclick="logout()">
    <span class="menu-icon icon-exit">
      <svg viewBox="0 0 24 24">
        <path d="M10 4H5v16h5"/>
        <path d="M14 8l4 4-4 4"/>
        <path d="M18 12H9"/>
      </svg>
    </span>
    Выйти
  </button>
</div>

<!-- Переписка -->

<section id="chatPage" class="screen">
  <div class="chat-header">
    <button class="icon-button" onclick="closeChat()">←</button>
    <div class="avatar" id="chatAvatar">M</div>
    <div>
      <b id="chatTitle">Чат</b>
      <div class="small" id="chatUsername"></div>
    </div>
  </div>

  <div class="chat-messages" id="messages"></div>

  <div class="chat-input-area">
    <input id="messageInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button class="send" onclick="sendMessage()">➤</button>
  </div>
</section>

<script>
let currentUser = null;
let currentChat = null;
let unsubscribeMessages = null;
let unsubscribeChats = null;
let unsubscribeChatMessages = [];
let avatarData = "";
let chats = [];

let users = JSON.parse(localStorage.getItem("maringram_users") || "[]");

function saveUsers() {
  localStorage.setItem("maringram_users", JSON.stringify(users));
}

function setTheme(theme) {
  document.body.classList.toggle("dark", theme === "dark");
  localStorage.setItem("maringram_theme", theme);
}

setTheme(localStorage.getItem("maringram_theme") || "light");

function showRegister() {
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("registerForm").style.display = "block";
}

function showLogin() {
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("registerForm").style.display = "none";
}

async function register() {
  const fb = window.MaringramFirebase;
console.log("REGISTER CLICKED");
console.log("Firebase:", fb);
  
  let name = document.getElementById("regName").value.trim();
  let username = document.getElementById("regUsername").value.trim().toLowerCase().replace("@","");
  let password = document.getElementById("regPassword").value;

  if (!name || !username || !password) {
    alert("Заполни все поля");
    return;
  }

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    alert("Username: 3–20 символов, английские буквы, цифры и _");
    return;
  }

  if (password.length < 6) {
    alert("Пароль должен содержать минимум 6 символов");
    return;
  }

  const email = username + "@maringram.app";
  const claimId = Date.now().toString() + Math.random().toString(36).slice(2);
  const usernameRef = fb.doc(fb.db, "usernames", username);

  try {
    await fb.runTransaction(fb.db, async (transaction) => {
      const existing = await transaction.get(usernameRef);

      if (existing.exists()) {
        throw new Error("USERNAME_TAKEN");
      }

      transaction.set(usernameRef, {
        username,
        claimId
      });
    });

    const credential = await fb.createUserWithEmailAndPassword(
      fb.auth,
      email,
      password
    );

    const uid = credential.user.uid;

    await fb.setDoc(fb.doc(fb.db, "users", uid), {
      uid,
      name,
      username,
      bio: "",
      avatar: "",
      createdAt: fb.serverTimestamp()
    });

    await fb.setDoc(usernameRef, {
      username,
      uid
    });

    currentUser = {
      uid,
      name,
      username,
      bio: "",
      avatar: ""
    };

    enterApp();

  } catch (error) {
    await fb.runTransaction(fb.db, async (transaction) => {
      const existing = await transaction.get(usernameRef);

      if (existing.exists() && existing.data().claimId === claimId) {
        transaction.delete(usernameRef);
      }
    });

    if (error.message === "USERNAME_TAKEN") {
      alert("Этот username уже занят");
    } else {
      console.error(error);
      alert("Ошибка регистрации: " + error.message);
    }
  }
}

async function login() {
  const fb = window.MaringramFirebase;

  let username = document.getElementById("loginUsername").value.trim().toLowerCase().replace("@","");
  let password = document.getElementById("loginPassword").value;

  if (!username || !password) {
    alert("Заполни все поля");
    return;
  }

  try {
    const email = username + "@maringram.app";

    const credential = await fb.signInWithEmailAndPassword(
      fb.auth,
      email,
      password
    );

    const uid = credential.user.uid;

    const userDoc = await fb.getDoc(
      fb.doc(fb.db, "users", uid)
    );

    if (!userDoc.exists()) {
      alert("Профиль пользователя не найден");
      return;
    }

    currentUser = userDoc.data();
    enterApp();

  } catch (error) {
    console.error(error);
    alert("Неверный username или пароль");
  }
    }
function loadChats() {
  const fb = window.MaringramFirebase;

  if (unsubscribeChats) {
    unsubscribeChats();
    unsubscribeChats = null;
  }

  unsubscribeChatMessages.forEach(unsubscribe => unsubscribe());
  unsubscribeChatMessages = [];

  const chatsQuery = fb.query(
    fb.collection(fb.db, "chats"),
    fb.where("members", "array-contains", currentUser.uid)
  );

  unsubscribeChats = fb.onSnapshot(chatsQuery, snapshot => {
    snapshot.docChanges().forEach(async change => {
      const chatDoc = change.doc;
      const chatId = chatDoc.id;

      if (change.type === "removed") {
        const index = chats.findIndex(chat => chat.id === chatId);

        if (index !== -1) {
          chats.splice(index, 1);
          renderChats();
        }

        return;
      }

      if (chats.some(chat => chat.id === chatId)) return;

      const data = chatDoc.data();

      const otherUid = data.members.find(
        uid => uid !== currentUser.uid
      );

      if (!otherUid) return;

      try {
        const userDoc = await fb.getDoc(
          fb.doc(fb.db, "users", otherUid)
        );

        if (!userDoc.exists()) return;

        const user = userDoc.data();

        const chat = {
          id: chatId,
          uid: otherUid,
          username: user.username,
          name: user.name,
          messages: [],
          unreadCount: 0
        };

        chats.push(chat);
        renderChats();

        const messagesRef = fb.collection(
          fb.db,
          "chats",
          chatId,
          "messages"
        );

        const unsubscribe = fb.onSnapshot(messagesRef, messagesSnapshot => {
          chat.messages = messagesSnapshot.docs.map(messageDoc => {
            const message = messageDoc.data();

            return {
              id: messageDoc.id,
              text: message.text,
              mine: message.senderUid === currentUser.uid,
              readBy: message.readBy || [],
              createdAt: message.createdAt
            };
          });

          chat.messages.sort((a, b) => {
            const timeA = a.createdAt?.toMillis() || 0;
            const timeB = b.createdAt?.toMillis() || 0;
            return timeA - timeB;
          });

          chat.unreadCount = chat.messages.filter(message =>
            !message.mine &&
            !message.readBy.includes(currentUser.uid)
          ).length;

          renderChats();

        }, error => {
          console.error("Ошибка обновления чата:", error);
        });

        unsubscribeChatMessages.push(unsubscribe);

      } catch (error) {
        console.error("Ошибка загрузки чата:", error);
      }
    });
  }, error => {
    console.error("Ошибка обновления списка чатов:", error);
  });
  }
function enterApp() {
  document.getElementById("auth").classList.remove("active");
  document.getElementById("main").classList.add("active");
  document.getElementById("chatPage").classList.remove("active");

  updateProfile();
  loadChats();
  showHome();
}

function logout() {
  closeMenu();
  currentUser = null;
  document.getElementById("main").classList.remove("active");
  document.getElementById("chatPage").classList.remove("active");
  document.getElementById("auth").classList.add("active");
  showLogin();
}

function updateProfile() {
  if (!currentUser) return;

  document.getElementById("drawerName").textContent = currentUser.name;
  document.getElementById("drawerUsername").textContent = "@" + currentUser.username;

  let avatar = document.getElementById("drawerAvatar");
  if (currentUser.avatar) {
    avatar.innerHTML = "";
    avatar.style.backgroundImage = `url("${currentUser.avatar}")`;
    avatar.style.backgroundSize = "cover";
  } else {
    avatar.style.backgroundImage = "";
    avatar.textContent = currentUser.name[0].toUpperCase();
  }

  document.getElementById("profileAvatar").innerHTML = "";
  let profileAvatar = document.getElementById("profileAvatar");

  if (currentUser.avatar) {
    profileAvatar.style.backgroundImage = `url("${currentUser.avatar}")`;
    profileAvatar.style.backgroundSize = "cover";
  } else {
    profileAvatar.style.backgroundImage = "";
    profileAvatar.textContent = currentUser.name[0].toUpperCase();
  }

  document.getElementById("editName").value = currentUser.name;
  document.getElementById("editUsername").value = currentUser.username;
  document.getElementById("editBio").value = currentUser.bio || "";
}

function changeAvatar(event) {
  let file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Выбери изображение");
    return;
  }

  let reader = new FileReader();
  reader.onload = () => {
    avatarData = reader.result;
    currentUser.avatar = avatarData;
    saveCurrentUser();
    updateProfile();
  };
  reader.readAsDataURL(file);
}

function saveProfile() {
  let name = document.getElementById("editName").value.trim();
  let username = document.getElementById("editUsername").value.trim().toLowerCase().replace("@","");
  let bio = document.getElementById("editBio").value.trim();

  if (!name || !username) {
    alert("Имя и username обязательны");
    return;
  }

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    alert("Username должен содержать 3–20 английских букв, цифр или _");
    return;
  }

  if (users.some(u => u.username === username && u.username !== currentUser.username)) {
    alert("Этот username уже занят");
    return;
  }

  currentUser.name = name;
  currentUser.username = username;
  currentUser.bio = bio;

  saveCurrentUser();
  updateProfile();
  alert("Профиль сохранён");
}

function saveCurrentUser() {
  let index = users.findIndex(u => u.username === currentUser.username);
  if (index !== -1) users[index] = currentUser;
  saveUsers();
}

function renderChats() {
  let list = document.getElementById("chatList");
  list.innerHTML = "";

  chats.forEach(chat => {
    let item = document.createElement("div");
    item.className = "chat-item";
    item.onclick = () => openChat(chat);

    let avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = chat.name[0].toUpperCase();

    let info = document.createElement("div");
    info.className = "chat-info";

    let nameRow = document.createElement("div");
    nameRow.style.display = "flex";
    nameRow.style.justifyContent = "space-between";
    nameRow.style.alignItems = "center";
    nameRow.style.width = "100%";

    let name = document.createElement("div");
    name.className = "chat-name";
    name.textContent = chat.name;

    let time = document.createElement("div");
    time.style.fontSize = "11px";
    time.style.color = "#999";

    if (chat.messages.length) {
      const lastMessage = chat.messages[chat.messages.length - 1];

      if (lastMessage.createdAt) {
        time.textContent = lastMessage.createdAt.toDate().toLocaleTimeString("ru-RU", {
          hour: "2-digit",
          minute: "2-digit"
        });
      }
    }

    nameRow.append(name, time);

    let last = document.createElement("div");
    last.className = "chat-last";

    if (chat.messages.length) {
      const lastMessage = chat.messages[chat.messages.length - 1];

      last.textContent = lastMessage.mine
        ? "Вы: " + lastMessage.text
        : lastMessage.text;
    } else {
      last.textContent = "Начните общение";
    }

    let bottomRow = document.createElement("div");
    bottomRow.style.display = "flex";
    bottomRow.style.justifyContent = "space-between";
    bottomRow.style.alignItems = "center";
    bottomRow.style.width = "100%";

    bottomRow.append(last);

    if (chat.unreadCount > 0) {
      let badge = document.createElement("div");
      badge.textContent = chat.unreadCount;
      badge.style.background = "#3390ec";
      badge.style.color = "white";
      badge.style.borderRadius = "50%";
      badge.style.minWidth = "20px";
      badge.style.height = "20px";
      badge.style.display = "flex";
      badge.style.alignItems = "center";
      badge.style.justifyContent = "center";
      badge.style.fontSize = "11px";
      badge.style.fontWeight = "bold";
      badge.style.padding = "0 4px";
      badge.style.boxSizing = "border-box";

      bottomRow.append(badge);
    }

    info.append(nameRow, bottomRow);
    item.append(avatar, info);
    list.append(item);
  });
  }

function filterChats(value) {
  let query = value.toLowerCase();
  document.querySelectorAll(".chat-item").forEach(item => {
    item.style.display = item.textContent.toLowerCase().includes(query) ? "flex" : "none";
  });
}

async function searchUsers() {
  const fb = window.MaringramFirebase;

  let searchText = document.getElementById("userSearch").value
    .trim()
    .toLowerCase()
    .replace("@", "");

  let results = document.getElementById("searchResults");
  results.innerHTML = "";

  if (!searchText) return;

  try {
    const usersQuery = fb.query(
      fb.collection(fb.db, "users"),
      fb.where("username", ">=", searchText),
      fb.where("username", "<=", searchText + "\uf8ff")
    );

    const snapshot = await fb.getDocs(usersQuery);

    let found = [];

    snapshot.forEach(doc => {
      let user = doc.data();

      if (user.username !== currentUser.username) {
        found.push(user);
      }
    });

    if (!found.length) {
      results.textContent = "Пользователи не найдены";
      return;
    }

    found.forEach(user => {
      let item = document.createElement("div");
      item.className = "chat-item";

      let avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = user.name
        ? user.name[0].toUpperCase()
        : "?";

      let info = document.createElement("div");
      info.className = "chat-info";

      let name = document.createElement("div");
      name.className = "chat-name";
      name.textContent = user.name;

      let username = document.createElement("div");
      username.className = "chat-last";
      username.textContent = "@" + user.username;

      let button = document.createElement("button");
      button.className = "primary";
      button.style.width = "auto";
      button.style.padding = "10px";
      button.textContent = "Написать";
      button.onclick = () => startChat(user);

      info.append(name, username);
      item.append(avatar, info, button);
      results.append(item);
    });

  } catch (error) {
    console.error(error);
    results.textContent = "Ошибка поиска пользователей";
  }
}

async function startChat(user) {
  const fb = window.MaringramFirebase;

  if (!currentUser.uid || !user.uid) {
    alert("Не удалось определить пользователей");
    return;
  }

  const members = [currentUser.uid, user.uid].sort();
  const chatId = members.join("_");

  const chatRef = fb.doc(fb.db, "chats", chatId);

  try {
    await fb.setDoc(chatRef, {
      members: members,
      updatedAt: fb.serverTimestamp()
    }, { merge: true });

    let chat = chats.find(c => c.id === chatId);

    if (!chat) {
      chat = {
        id: chatId,
        username: user.username,
        name: user.name,
        uid: user.uid,
        messages: []
      };

      chats.push(chat);
    }

    renderChats();
    openChat(chat);

  } catch (error) {
    console.error(error);
    alert("Не удалось создать чат: " + error.message);
  }
  }

function openChat(chat) {
  const fb = window.MaringramFirebase;

  currentChat = chat;

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  document.getElementById("main").classList.remove("active");
  document.getElementById("chatPage").classList.add("active");

  document.getElementById("chatTitle").textContent = chat.name;
  document.getElementById("chatUsername").textContent = "@" + chat.username;
  document.getElementById("chatAvatar").textContent = chat.name[0].toUpperCase();

  currentChat.messages = [];
  renderMessages();

  const messagesRef = fb.collection(
    fb.db,
    "chats",
    chat.id,
    "messages"
  );

  unsubscribeMessages = fb.onSnapshot(messagesRef, snapshot => {
    if (currentChat !== chat) return;

    currentChat.messages = snapshot.docs.map(doc => {
      const message = doc.data();

      return {
        id: doc.id,
        text: message.text,
        mine: message.senderUid === currentUser.uid,
        status: (message.readBy || []).includes(chat.uid) ? "read" : "sent",
        readBy: message.readBy || [],
        createdAt: message.createdAt
      };
    });

    snapshot.docs.forEach(async messageDoc => {
      const message = messageDoc.data();

      if (
        message.senderUid !== currentUser.uid &&
        !(message.readBy || []).includes(currentUser.uid)
      ) {
        try {
          await fb.updateDoc(
            fb.doc(fb.db, "chats", chat.id, "messages", messageDoc.id),
            {
              readBy: fb.arrayUnion(currentUser.uid)
            }
          );
        } catch (error) {
          console.error("Ошибка отметки прочтения:", error);
        }
      }
    });

    currentChat.messages.sort((a, b) => {
      const timeA = a.createdAt?.toMillis() || 0;
      const timeB = b.createdAt?.toMillis() || 0;
      return timeA - timeB;
    });

    renderMessages();

  }, error => {
    console.error(error);
    alert("Ошибка загрузки сообщений: " + error.message);
  });
  }

function closeChat() {
  document.getElementById("chatPage").classList.remove("active");
  document.getElementById("main").classList.add("active");
  currentChat = null;
  renderChats();
}

function renderMessages() {
  let box = document.getElementById("messages");
  box.innerHTML = "";

  currentChat.messages.forEach(message => {
    let bubble = document.createElement("div");
    bubble.className = "message" + (message.mine ? " mine" : "");

    let text = document.createElement("div");
    text.textContent = message.text;

    let meta = document.createElement("div");
    meta.className = "message-meta";

    let time = "…";

    if (message.createdAt) {
      const date = message.createdAt.toDate();

      time = date.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    meta.textContent = time;

    if (message.mine) {
      let status = document.createElement("span");
      status.className = "message-status";

      status.textContent =
        message.status === "sending" ? "◷" :
        message.status === "sent" ? "○" : "●";

      meta.append(status);
    }

    bubble.append(text, meta);
    box.append(bubble);
  });

  box.scrollTop = box.scrollHeight;
  }

async function sendMessage() {
  const fb = window.MaringramFirebase;

  let input = document.getElementById("messageInput");
  let text = input.value.trim();

  if (!text || !currentChat) return;

  if (!currentChat.id || !currentUser.uid) {
    alert("Не удалось определить чат или пользователя");
    return;
  }

  input.disabled = true;

  try {
    await fb.addDoc(
      fb.collection(fb.db, "chats", currentChat.id, "messages"),
      {
        text: text,
        senderUid: currentUser.uid,
        createdAt: fb.serverTimestamp(),
        readBy: []
      }
    );

    input.value = "";

  } catch (error) {
    console.error(error);
    alert("Не удалось отправить сообщение: " + error.message);
  } finally {
    input.disabled = false;
  }
  }
